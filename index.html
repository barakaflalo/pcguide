<style>
  :root{
    --green:#34c759; --yellow:#ffb020; --red:#ff453a;
    --radius:14px; --maxw:820px;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:border-box}

  html[data-theme="gold"]{--bg:#0a0a0a;--surface:#151515;--surface2:#1e1e1e;--border:#2c2c2c;--text:#f1ead6;--muted:#9a927e;--accent:#d4af37;--accent-ink:#0a0a0a;--accent-soft:rgba(212,175,55,.12)}
  html[data-theme="sapphire"]{--bg:#0a0e1a;--surface:#131a2a;--surface2:#1b2438;--border:#2a3550;--text:#e7ecf7;--muted:#8593b0;--accent:#5aa2ff;--accent-ink:#06101f;--accent-soft:rgba(90,162,255,.14)}
  html[data-theme="emerald"]{--bg:#08120d;--surface:#10201a;--surface2:#172c23;--border:#22402f;--text:#e4f0e9;--muted:#82a893;--accent:#37d39b;--accent-ink:#04140d;--accent-soft:rgba(55,211,155,.14)}
  html[data-theme="crimson"]{--bg:#130808;--surface:#221010;--surface2:#2d1717;--border:#43201f;--text:#f6e7e7;--muted:#b18787;--accent:#ff6b6b;--accent-ink:#160404;--accent-soft:rgba(255,107,107,.14)}
  html[data-theme="daylight"]{--bg:#f2efe7;--surface:#ffffff;--surface2:#f6f3ea;--border:#ddd5c4;--text:#1c1a15;--muted:#6d6553;--accent:#b8860b;--accent-ink:#ffffff;--accent-soft:rgba(184,134,11,.12)}

  body{
    margin:0;font-family:'Segoe UI','Assistant',system-ui,-apple-system,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.5;
    -webkit-tap-highlight-color:transparent;min-height:100vh;
  }
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px 64px}
  .mono{font-family:'Cascadia Code','Consolas','SF Mono',ui-monospace,monospace;direction:ltr;unicode-bidi:isolate}

  /* Header */
  header{position:sticky;top:env(safe-area-inset-top,0);z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .hbar{max-width:var(--maxw);margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
  .brand{font-weight:800;font-size:18px;letter-spacing:.2px;cursor:pointer;display:flex;align-items:center;gap:8px}
  .brand .dot{width:10px;height:10px;border-radius:3px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
  .spacer{flex:1}
  .iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .15s}
  .iconbtn:hover{border-color:var(--accent)}
  .pcchip{display:flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--muted);transition:border-color .15s}
  .pcchip:hover{border-color:var(--accent)}
  .pcchip b{color:var(--text);font-weight:600}

  /* Buttons */
  .btn{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:11px 16px;border-radius:11px;font-size:15px;cursor:pointer;font-family:inherit;transition:.15s;display:inline-flex;align-items:center;gap:8px;justify-content:center}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.block{width:100%}
  .btn.ghost{background:transparent}
  .backbtn{margin:18px 0 6px;font-weight:700}

  /* Home */
  .hero{padding:30px 4px 8px}
  .hero h1{font-size:27px;margin:0 0 6px;font-weight:800;letter-spacing:.2px}
  .hero p{margin:0;color:var(--muted);font-size:15px}
  .search{margin:20px 0 8px;position:relative}
  .search input{width:100%;padding:15px 46px 15px 16px;border-radius:13px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:16px;font-family:inherit}
  html[dir="ltr"] .search input{padding:15px 16px 15px 46px}
  .search input:focus{outline:none;border-color:var(--accent)}
  .search .mag{position:absolute;top:50%;transform:translateY(-50%);right:16px;color:var(--muted);pointer-events:none}
  html[dir="ltr"] .search .mag{right:auto;left:16px}

  .sectitle{font-size:13px;color:var(--muted);margin:26px 2px 10px;font-weight:600}

  .troublecard{border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--radius);padding:16px 18px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:.15s;margin-bottom:8px}
  .troublecard:hover{filter:brightness(1.06)}
  .troublecard .em{font-size:26px}
  .troublecard h3{margin:0 0 2px;font-size:16px}
  .troublecard p{margin:0;color:var(--muted);font-size:13px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .cat{border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);padding:16px 14px;cursor:pointer;transition:.15s;text-align:start}
  .cat:hover{border-color:var(--accent);transform:translateY(-2px)}
  .cat .em{font-size:24px;display:block;margin-bottom:8px}
  .cat h3{margin:0 0 3px;font-size:15px}
  .cat span{color:var(--muted);font-size:12px}

  /* List items */
  .item{border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);padding:14px 16px;margin-bottom:9px;cursor:pointer;transition:.15s;display:flex;align-items:flex-start;gap:12px}
  .item:hover{border-color:var(--accent)}
  .item.dim{opacity:.5}
  .item .risk{width:9px;height:9px;border-radius:50%;margin-top:7px;flex:none}
  .risk.green{background:var(--green)} .risk.yellow{background:var(--yellow)} .risk.red{background:var(--red)}
  .item .body{flex:1;min-width:0}
  .item h3{margin:0 0 2px;font-size:16px}
  .item p{margin:0;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
  .tag{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}
  .tag.admin{border-color:var(--yellow);color:var(--yellow)}
  .tag.unsupported{border-color:var(--red);color:var(--red)}

  /* Detail card */
  .detail{border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);padding:20px;margin-top:8px}
  .detail h2{margin:0 0 4px;font-size:22px}
  .detail .sub{color:var(--muted);font-size:14px;margin:0 0 16px}
  .risk-banner{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:11px;margin:14px 0;font-size:14px;font-weight:600}
  .risk-banner.green{background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green)}
  .risk-banner.yellow{background:color-mix(in srgb,var(--yellow) 15%,transparent);color:var(--yellow)}
  .risk-banner.red{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)}
  .meta-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  .meta{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}

  .method{border:1px solid var(--border);border-radius:12px;padding:13px 14px;margin:10px 0;background:var(--surface2)}
  .method.best{border-color:var(--accent)}
  .method .mhead{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-size:13px;color:var(--muted);font-weight:600}
  .method .mhead .best-tag{color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:1px 8px;font-size:11px}
  .cmdrow{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:10px 12px}
  .cmdrow .cmd{flex:1;font-size:15px;overflow-x:auto;white-space:nowrap}
  .copybtn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 11px;font-size:13px;cursor:pointer;flex:none;font-family:inherit}
  .copybtn:hover{border-color:var(--accent)}
  .copybtn.done{border-color:var(--green);color:var(--green)}
  .gpath{font-size:14px;line-height:1.7}
  .gpath .step{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:2px 8px;margin:0 2px;display:inline-block}

  .block{margin-top:16px}
  .block h4{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
  .block .txt{font-size:14px}
  .okbox{border-inline-start:3px solid var(--green);padding:8px 12px;background:color-mix(in srgb,var(--green) 8%,transparent);border-radius:0 8px 8px 0}
  .errbox{border-inline-start:3px solid var(--red);padding:8px 12px;background:color-mix(in srgb,var(--red) 8%,transparent);border-radius:0 8px 8px 0;margin-bottom:6px}
  .warnbox{border-inline-start:3px solid var(--yellow);padding:8px 12px;background:color-mix(in srgb,var(--yellow) 8%,transparent);border-radius:0 8px 8px 0}
  a.src{color:var(--accent);font-size:13px;text-decoration:none}
  a.src:hover{text-decoration:underline}
  .favbtn{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;padding:0 4px}
  .favbtn.on{color:var(--accent)}

  /* Troubleshoot flow */
  .tstep{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:16px;margin-bottom:10px;position:relative}
  .tstep .num{position:absolute;inset-inline-start:-1px;top:-1px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:13px;width:28px;height:28px;border-radius:12px 0 12px 0;display:flex;align-items:center;justify-content:center}
  .tstep .do{font-size:15px;font-weight:600;margin:2px 0 10px;padding-inline-start:24px}
  .tstep .check{font-size:13px;color:var(--muted);margin-top:10px;padding-inline-start:6px;border-inline-start:2px solid var(--border)}

  /* Setup / modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
  .sheet{background:var(--surface);border:1px solid var(--border);border-radius:18px;max-width:520px;width:100%;max-height:92vh;overflow:auto;padding:24px}
  .sheet h2{margin:0 0 4px;font-size:22px}
  .sheet .lead{color:var(--muted);font-size:14px;margin:0 0 20px}
  .choice-lbl{font-size:13px;color:var(--muted);font-weight:600;margin:18px 0 8px}
  .choices{display:flex;flex-wrap:wrap;gap:8px}
  .choice{border:1px solid var(--border);background:var(--surface2);color:var(--text);padding:9px 15px;border-radius:10px;cursor:pointer;font-size:14px;font-family:inherit;transition:.12s}
  .choice:hover{border-color:var(--accent)}
  .choice.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
  .choice.legacy{opacity:.85}
  .hint{font-size:12px;color:var(--muted);margin-top:8px;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:9px 12px;display:none}
  .hint.show{display:block}
  .hint .mono{color:var(--accent)}
  .sheet .foot{margin-top:24px;display:flex;gap:10px}

  .theme-swatches{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .sw{width:42px;height:42px;border-radius:11px;cursor:pointer;border:2px solid transparent;position:relative}
  .sw.on{border-color:var(--text)}
  .empty{color:var(--muted);text-align:center;padding:40px 0;font-size:15px}
  .footer{text-align:center;color:var(--muted);font-size:12px;padding:30px 0 10px}
  .footer b{color:var(--accent)}
  .about p{font-size:14px;line-height:1.7}
  .about .card{border:1px solid var(--border);background:var(--surface2);border-radius:12px;padding:14px 16px;font-size:13px;margin:12px 0}
  .about .card div{margin:3px 0;color:var(--muted)}
  .about .card b{color:var(--text)}
  .disc{font-size:12px;color:var(--muted);border:1px solid var(--yellow);border-radius:10px;padding:12px 14px;margin-top:14px;background:color-mix(in srgb,var(--yellow) 6%,transparent)}
</style>

/* ============================ HELPERS ============================ */
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const app=()=>document.getElementById('app');
function applyDir(){document.documentElement.lang=P.uiLang;document.documentElement.dir=P.uiLang==="he"?"rtl":"ltr";}
function saveProfile(){store.set('pcg_profile',JSON.stringify(P));}
function loadProfile(){try{const r=store.get('pcg_profile');if(r)P=Object.assign(P,JSON.parse(r));}catch(e){}}
function applyTheme(id){document.documentElement.setAttribute('data-theme',id);store.set('pcg_theme',id);
  const t=THEMES.find(x=>x.id===id);if(t){const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t.bg;}}
/* favorites */
function favs(){try{return JSON.parse(store.get('pcg_favs')||'[]');}catch(e){return[];}}
function isFav(id){return favs().includes(id);}
function toggleFav(id){let f=favs();f.includes(id)?f=f.filter(x=>x!==id):f.push(id);store.set('pcg_favs',JSON.stringify(f));}

function compatState(c){if(!c)return"no";return c[P.winVer]||"no";}
function itemSupported(it){return compatState(it.compat)!=="no";}
function bestMethods(it){/* methods applicable to current version, best first */
  const ms=(it.methods||[]).filter(m=>!m.compat||compatState(m.compat)!=="no");
  return ms.sort((a,b)=>(b.best?1:0)-(a.best?1:0));}
function guiPath(m){/* resolve gui path for version + sys lang with fallback */
  if(!m.paths)return null;const order=["win11","win10","win81","win8","win7","vista","xp"];
  let node=m.paths[P.winVer];
  if(!node){const i=order.indexOf(P.winVer);for(let j=i+1;j<order.length&&!node;j++)node=m.paths[order[j]];
    for(let j=i-1;j>=0&&!node;j--)node=m.paths[order[j]];}
  if(!node)node=Object.values(m.paths)[0];
  if(!node)return null;return node[P.sysLang]!=null?node[P.sysLang]:(node.en||node.he);}

];

/* ============================ ROUTER ============================ */
let stack=[];
function go(screen,param){stack.push({screen,param});render(screen,param);window.scrollTo(0,0);}
function back(){stack.pop();const p=stack[stack.length-1]||{screen:'home'};render(p.screen,p.param);window.scrollTo(0,0);}
function render(screen,param){
  document.getElementById('brandName').textContent=T('brand');
  updateChip();
  const c=app();c.innerHTML='';
  if(screen==='home')return renderHome(c);
  if(screen==='category')return renderCategory(c,param);
  if(screen==='search')return renderSearch(c,param);
  if(screen==='item')return renderItem(c,param);
  if(screen==='tree')return renderTree(c,param);
  if(screen==='favs')return renderFavs(c);
  if(screen==='type')return renderType(c,param);
  if(screen==='settings')return renderSettings(c);
  if(screen==='about')return renderAbout(c);
}
function updateChip(){const chip=document.getElementById('pcChip');
  chip.innerHTML=`🖥️ <b>${verLabel(P.winVer).replace('Windows ','Win ')}</b> · ${P.arch==='x64'?'64':'32'}bit`;}

/* ============================ SCREENS ============================ */
function renderHome(c){
  const hero=el('div','hero');
  hero.appendChild(el('h1',null,esc(T('heroTitle'))));
  hero.appendChild(el('p',null,esc(T('heroSub'))));
  c.appendChild(hero);

  // search
  const s=el('div','search');
  s.innerHTML=`<input id="q" placeholder="${esc(T('searchPh'))}" autocomplete="off"><span class="mag">🔍</span>`;
  c.appendChild(s);
  const inp=s.querySelector('#q');
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&inp.value.trim())go('search',inp.value.trim());});
  inp.addEventListener('input',()=>{if(inp.value.trim().length>=2)go('search',inp.value.trim());});

  // troubleshoot trees
  c.appendChild(el('div','sectitle',esc(T('troubleHead'))));
  TREES.forEach(t=>{
    const d=el('div','troublecard');
    d.innerHTML=`<span class="em">${t.em}</span><div><h3>${esc(L(t.title))}</h3><p>${esc(L(t.intro))}</p></div>`;
    d.onclick=()=>go('tree',t.id);c.appendChild(d);
  });

  // categories
  c.appendChild(el('div','sectitle',esc(T('catsHead'))));
  const g=el('div','grid');
  CATS.forEach(cat=>{
    const n=(cat.id==='troubleshoot'?TREES.length:0)+ITEMS.filter(i=>i.cat===cat.id).length;
    const d=el('div','cat');
    d.innerHTML=`<span class="em">${cat.em}</span><h3>${esc(L(cat))}</h3><span>${n}</span>`;
    d.onclick=()=>go('category',cat.id);g.appendChild(d);
  });
  // favorites tile
  const fav=el('div','cat');fav.innerHTML=`<span class="em">⭐</span><h3>${esc(T('favs'))}</h3><span>${favs().length}</span>`;
  fav.onclick=()=>go('favs');g.appendChild(fav);
  c.appendChild(g);

  // browse by command type
  const he=P.uiLang==='he';
  c.appendChild(el('div','sectitle',he?'עיון לפי סוג פקודה':'Browse by command type'));
  const trow=el('div');trow.style.cssText='display:flex;flex-wrap:wrap;gap:8px';
  TYPE_CHIPS.forEach(tc=>{
    const n=ITEMS.filter(i=>i.methods.some(m=>m.type===tc.type)).length;
    const b=el('button','choice');
    b.innerHTML=`${tc.em} ${esc(L(tc))} <span style="opacity:.55">· ${n}</span>`;
    b.onclick=()=>go('type',tc.type);trow.appendChild(b);
  });
  c.appendChild(trow);

  c.appendChild(el('div','footer',`AppNest · ${esc(T('brand'))} · v${APP_VERSION} · ${ITEMS.length} ${he?'פקודות':'commands'} — <b>barakaflalo.github.io/appnest</b>`));
}

function itemRow(it){
  const supported=itemSupported(it);
  const d=el('div','item'+(supported?'':' dim'));
  const tags=[];
  if(it.admin)tags.push(`<span class="tag admin">🛡️ ${esc(T('admin'))}</span>`);
  if(!supported)tags.push(`<span class="tag unsupported">${esc(T('notSupported'))}${esc(verLabel(P.winVer))}</span>`);
  d.innerHTML=`<span class="risk ${it.risk}"></span><div class="body"><h3>${esc(L(it.title))}</h3><p>${esc(L(it.desc))}</p>${tags.length?`<div class="tags">${tags.join('')}</div>`:''}</div>`;
  d.onclick=()=>go('item',it.id);return d;
}

function renderCategory(c,catId){
  c.appendChild(backBtn());
  const cat=CATS.find(x=>x.id===catId);
  const head=el('div','hero');head.innerHTML=`<h1>${cat.em} ${esc(L(cat))}</h1>`;c.appendChild(head);
  if(catId==='troubleshoot'){
    TREES.forEach(t=>{const d=el('div','troublecard');
      d.innerHTML=`<span class="em">${t.em}</span><div><h3>${esc(L(t.title))}</h3><p>${esc(L(t.intro))}</p></div>`;
      d.onclick=()=>go('tree',t.id);c.appendChild(d);});
  }
  const list=ITEMS.filter(i=>i.cat===catId);
  // supported first
  list.sort((a,b)=>(itemSupported(b)?1:0)-(itemSupported(a)?1:0));
  list.forEach(it=>c.appendChild(itemRow(it)));
  if(!list.length&&catId!=='troubleshoot')c.appendChild(el('div','empty',esc(T('noResults'))));
}

function searchScore(it,q){
  const toks=q.toLowerCase().split(/\s+/).filter(Boolean);
  const hay=[L(it.title),it.title.he,it.title.en,L(it.desc),
    ...(it.kw?.he||[]),...(it.kw?.en||[]),...(it.methods||[]).map(m=>m.value||'')].join(' ').toLowerCase();
  let sc=0;toks.forEach(t=>{if(hay.includes(t))sc+=1;});
  return toks.length&&sc===toks.length?sc:(sc>0?sc*0.5:0);
}
function renderSearch(c,q){
  c.appendChild(backBtn());
  const s=el('div','search');
  s.innerHTML=`<input id="q" value="${esc(q)}" placeholder="${esc(T('searchPh'))}"><span class="mag">🔍</span>`;
  c.appendChild(s);
  const inp=s.querySelector('#q');inp.focus();
  inp.addEventListener('input',()=>{clearTimeout(inp._t);inp._t=setTimeout(()=>{
    stack[stack.length-1]={screen:'search',param:inp.value.trim()};doSearch(c,inp.value.trim());},150);});
  const holder=el('div');c.appendChild(holder);
  doSearch(c,q,holder);
}
function doSearch(c,q,holder){
  holder=holder||c.querySelector('#results');
  let box=c.querySelector('#results');if(!box){box=el('div');box.id='results';c.appendChild(box);}
  box.innerHTML='';
  if(!q){return;}
  // trees too
  const treeHits=TREES.filter(t=>((L(t.title)+' '+t.title.he+' '+t.title.en).toLowerCase().includes(q.toLowerCase())));
  treeHits.forEach(t=>{const d=el('div','troublecard');
    d.innerHTML=`<span class="em">${t.em}</span><div><h3>${esc(L(t.title))}</h3><p>${esc(L(t.intro))}</p></div>`;
    d.onclick=()=>go('tree',t.id);box.appendChild(d);});
  const scored=ITEMS.map(it=>[it,searchScore(it,q)]).filter(x=>x[1]>0)
    .sort((a,b)=>b[1]-a[1]||(itemSupported(b[0])?1:0)-(itemSupported(a[0])?1:0));
  scored.forEach(([it])=>box.appendChild(itemRow(it)));
  if(!scored.length&&!treeHits.length)box.appendChild(el('div','empty',esc(T('noResults'))));
}

function renderItem(c,id){
  const it=ITEMS.find(x=>x.id===id);if(!it)return back();
  c.appendChild(backBtn());
  const d=el('div','detail');
  const favOn=isFav(id);
  d.innerHTML=`<div style="display:flex;align-items:flex-start;gap:10px">
     <div style="flex:1"><h2>${esc(L(it.title))}</h2><p class="sub">${esc(L(it.desc))}</p></div>
     <button class="favbtn ${favOn?'on':''}" id="favBtn" title="${esc(T('favs'))}">${favOn?'⭐':'☆'}</button></div>`;
  // risk banner
  const rk=it.risk;const rtxt=rk==='green'?T('riskGreen'):rk==='yellow'?T('riskYellow'):T('riskRed');
  const rb=el('div','risk-banner '+rk);rb.innerHTML=`<span>${rk==='green'?'🟢':rk==='yellow'?'🟡':'🔴'}</span><span>${esc(rtxt)}</span>`;
  d.appendChild(rb);
  // meta
  const meta=el('div','meta-row');
  meta.innerHTML=`<span class="meta">🖥️ ${esc(verLabel(P.winVer))}</span>`+
    (it.admin?`<span class="meta">🛡️ ${esc(T('admins'))}</span>`:'')+
    (!itemSupported(it)?`<span class="meta" style="border-color:var(--red);color:var(--red)">${esc(T('notSupported'))}${esc(verLabel(P.winVer))}</span>`:'');
  d.appendChild(meta);

  // methods
  const wh=el('div','block');wh.innerHTML=`<h4>${esc(T('waysHead'))}</h4>`;d.appendChild(wh);
  const ms=bestMethods(it);
  if(!ms.length){d.appendChild(el('div','warnbox',esc(T('notSupported'))+esc(verLabel(P.winVer))));}
  ms.forEach(m=>d.appendChild(methodEl(m)));

  // arch note
  if(it.archNote){const b=el('div','block');b.innerHTML=`<h4>🧩 ${esc(T('archNote'))} · ${P.arch==='arm64'?'ARM64':P.arch==='x64'?'64-bit':'32-bit'}</h4><div class="warnbox txt">${esc(L(it.archNote))}</div>`;d.appendChild(b);}
  // before
  if(it.before){const b=el('div','block');b.innerHTML=`<h4>⚠️ ${esc(T('before'))}</h4><div class="warnbox txt">${esc(L(it.before))}</div>`;d.appendChild(b);}
  // expected ok
  if(it.expectedOk){const b=el('div','block');b.innerHTML=`<h4>✅ ${esc(T('expectedOk'))}</h4><div class="okbox txt">${esc(L(it.expectedOk))}</div>`;d.appendChild(b);}
  // errors
  if(it.onError&&it.onError.length){const b=el('div','block');b.innerHTML=`<h4>❌ ${esc(T('onError'))}</h4>`;
    it.onError.forEach(e=>{const x=el('div','errbox txt');x.innerHTML=`<b>${esc(L(e.when))}</b> — ${esc(L(e.fix))}`;b.appendChild(x);});d.appendChild(b);}
  // undo
  if(it.undo){const b=el('div','block');b.innerHTML=`<h4>↩️ ${esc(T('undo'))}</h4><div class="txt">${esc(L(it.undo))}</div>`;d.appendChild(b);}
  // source
  if(it.source){const b=el('div','block');b.innerHTML=`<a class="src" href="${esc(it.source)}" target="_blank" rel="noopener">🔗 ${esc(T('source'))}</a>`;d.appendChild(b);}

  c.appendChild(d);
  d.querySelector('#favBtn').onclick=(e)=>{toggleFav(id);const on=isFav(id);e.target.textContent=on?'⭐':'☆';e.target.classList.toggle('on',on);};
}

function methodEl(m){
  const wrap=el('div','method'+(m.best?' best':''));
  const lbl=L(METHOD_LABEL[m.type]||{en:m.type});
  wrap.innerHTML=`<div class="mhead"><span>${methodEmoji(m.type)} ${esc(lbl)}</span>${m.best?`<span class="best-tag">${esc(T('best'))}</span>`:''}</div>`;
  if(m.type==='gui'){
    const path=guiPath(m);
    const pv=el('div','gpath');
    pv.innerHTML=String(path||'').split('←').map(s=>`<span class="step">${esc(s.trim())}</span>`).join('<span style="color:var(--muted)"> ← </span>');
    wrap.appendChild(pv);
  }else{
    const row=el('div','cmdrow');
    row.innerHTML=`<span class="cmd mono">${esc(m.value)}</span><button class="copybtn">${esc(T('copy'))}</button>`;
    const btn=row.querySelector('.copybtn');
    btn.onclick=()=>copyText(m.value,btn);
    wrap.appendChild(row);
    if(m.type==='shortcut'){/* shortcut isn't really copyable command but keep copy for convenience */}
  }
  return wrap;
}
function methodEmoji(t){return{shortcut:"⌨️",run:"▶️",cmd:"💻",powershell:"🔵",gui:"🖱️"}[t]||"•";}
function copyText(txt,btn){
  const done=()=>{if(btn){btn.textContent=T('copied');btn.classList.add('done');setTimeout(()=>{btn.textContent=T('copy');btn.classList.remove('done');},1400);}};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done));}
  else fallbackCopy(txt,done);
}
function fallbackCopy(txt,cb){const ta=el('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);cb&&cb();}

function renderTree(c,id){
  const t=TREES.find(x=>x.id===id);if(!t)return back();
  c.appendChild(backBtn());
  const h=el('div','hero');h.innerHTML=`<h1>${t.em} ${esc(L(t.title))}</h1><p>${esc(L(t.intro))}</p>`;c.appendChild(h);
  c.appendChild(el('div','sectitle',esc(T('tryFlow'))));
  t.steps.forEach((s,i)=>{
    const d=el('div','tstep');
    d.innerHTML=`<span class="num">${i+1}</span><div class="do">${esc(L(s.do))}</div>`;
    if(s.cmd){const row=el('div','cmdrow');row.innerHTML=`<span class="cmd mono">${esc(s.cmd)}</span><button class="copybtn">${esc(T('copy'))}</button>`;
      row.querySelector('.copybtn').onclick=e=>copyText(s.cmd,e.target);d.appendChild(row);}
    d.appendChild(el('div','check',esc(L(s.check))));
    c.appendChild(d);
  });
}

function renderType(c,type){
  c.appendChild(backBtn());
  const tc=TYPE_CHIPS.find(x=>x.type===type)||{em:"",he:type,en:type};
  const head=el('div','hero');
  head.innerHTML=`<h1>${tc.em} ${esc(L(tc))}</h1><p>${P.uiLang==='he'?'כל הפעולות שאפשר לבצע כך':'Every action you can do this way'}</p>`;
  c.appendChild(head);
  const list=ITEMS.filter(i=>i.methods.some(m=>m.type===type));
  list.sort((a,b)=>(itemSupported(b)?1:0)-(itemSupported(a)?1:0));
  list.forEach(it=>c.appendChild(itemRow(it)));
  if(!list.length)c.appendChild(el('div','empty',esc(T('noResults'))));
}
function renderFavs(c){
  c.appendChild(backBtn());
  const h=el('div','hero');h.innerHTML=`<h1>⭐ ${esc(T('favs'))}</h1>`;c.appendChild(h);
  const f=favs();const list=ITEMS.filter(i=>f.includes(i.id));
  if(!list.length){c.appendChild(el('div','empty',esc(T('noFavs'))));return;}
  list.forEach(it=>c.appendChild(itemRow(it)));
}

function getAI(){try{return JSON.parse(store.get('pcg_ai')||'null');}catch(e){return null;}}
function setAI(o){store.set('pcg_ai',JSON.stringify(o));}
function aiFirstKey(s){return (s||'').split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean)[0]||'';}

let aiSel=null; // provider id currently shown in settings
async function aiTest(provider,keys,statusEl){
  const set=(txt,color)=>{if(statusEl){statusEl.textContent=txt;statusEl.style.color=color;}};
  set(P.uiLang==='he'?'בודק…':'Testing…','var(--muted)');
  try{
    let ok=false;
    if(provider==='gemini'){
      const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?key='+encodeURIComponent(aiFirstKey(keys.gemini)));
      ok=r.ok;
    }else if(provider==='claude'){
      const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':aiFirstKey(keys.claude),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1,messages:[{role:'user',content:'hi'}]})});
      ok=r.ok;
    }else if(provider==='openai'){
      const r=await fetch('https://api.openai.com/v1/models',{headers:{'Authorization':'Bearer '+aiFirstKey(keys.openai)}});
      ok=r.ok;
    }else if(provider==='device'){
      const base=(keys.deviceUrl||'').replace(/\/+$/,'');
      const r=await fetch(base+'/models').catch(()=>fetch(base));
      ok=r&&r.ok;
    }else if(provider==='custom'){
      const h={'Content-Type':'application/json'};if(aiFirstKey(keys.customKey))h['Authorization']='Bearer '+aiFirstKey(keys.customKey);
      const r=await fetch(keys.customUrl,{method:'POST',headers:h,body:JSON.stringify({model:'gpt-4o-mini',max_tokens:1,messages:[{role:'user',content:'hi'}]})});
      ok=r.ok;
    }
    if(ok)set(P.uiLang==='he'?'✓ החיבור עובד':'✓ Connection works','var(--green)');
    else set(P.uiLang==='he'?'✗ החיבור נכשל — בדוק את המפתח/הכתובת':'✗ Failed — check the key/URL','var(--red)');
  }catch(e){
    set((P.uiLang==='he'?'✗ שגיאה: ':'✗ Error: ')+(e.message||e),'var(--red)');
  }
}

      <button class="btn" id="aiTest">${he?'בדוק חיבור':'Test connection'}</button>
      ${saved.provider?`<button class="btn ghost" id="aiDisc">${he?'נתק':'Disconnect'}</button>`:''}
    </div>
    <div id="aiStatus" style="margin-top:10px;font-size:14px;min-height:18px"></div>
    <div style="margin-top:10px;font-size:12px;color:var(--muted)">🔒 ${he?'העוזר שולח שאלה, הקשר וחלק מהשיחה לספק שבחרת.':'The assistant sends your question, context and recent conversation to your chosen provider.'}</div>`;

  const readKeys=()=>{const o=Object.assign({},keys);pr.fields.forEach(f=>{const i=document.getElementById('ai_'+f.k);if(i)o[f.k]=i.value.trim();});return o;};
  panel.querySelector('#aiSave').onclick=()=>{
    const nk=readKeys();setAI({provider:aiSel,keys:nk});
    const st=document.getElementById('aiStatus');st.textContent=he?'נשמר ✓':'Saved ✓';st.style.color='var(--green)';
    renderSettings(c);
  };
  panel.querySelector('#aiTest').onclick=()=>aiTest(aiSel,readKeys(),document.getElementById('aiStatus'));
  const disc=panel.querySelector('#aiDisc');if(disc)disc.onclick=()=>{store.del('pcg_ai');aiSel=null;renderSettings(c);};

  /* ---- Backup / restore ---- */
  const bk=el('div','detail');bk.style.marginTop='14px';
  bk.innerHTML=`<h2 style="font-size:19px">💾 ${he?'גיבוי ושחזור':'Backup & restore'}</h2>
    <p class="sub">${he?'שומר את ההעדפות שלך ואת המועדפים לקובץ שאפשר לטעון במכשיר אחר.':'Saves your preferences and favorites to a file you can load on another device.'}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" id="bkExport">⬇️ ${he?'ייצוא גיבוי':'Export backup'}</button>
      <button class="btn" id="bkImport">⬆️ ${he?'ייבוא גיבוי':'Import backup'}</button>
    </div>`;
  c.appendChild(bk);
  bk.querySelector('#bkExport').onclick=()=>{
    const data={app:"pcguide",version:APP_VERSION,exported:new Date().toISOString(),profile:P,theme:store.get('pcg_theme')||'gold',favs:favs()};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=el('a');a.href=URL.createObjectURL(blob);a.download='pcguide-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  };
  bk.querySelector('#bkImport').onclick=()=>{
    const inp=el('input');inp.type='file';inp.accept='application/json,.json';
    inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();
      r.onload=()=>{try{const d=JSON.parse(r.result);
        if(d.profile){P=Object.assign(P,d.profile);saveProfile();applyDir();}
        if(d.theme)applyTheme(d.theme);
        if(Array.isArray(d.favs))store.set('pcg_favs',JSON.stringify(d.favs));
        alert(he?'הגיבוי נטען בהצלחה':'Backup loaded successfully');go('home');
      }catch(e){alert(he?'קובץ הגיבוי לא תקין':'Invalid backup file');}};
      r.readAsText(f);};
    inp.click();
  };

  /* ---- Profile + danger ---- */
  const dz=el('div','detail');dz.style.marginTop='14px';
  dz.innerHTML=`<h2 style="font-size:19px">🖥️ ${he?'המחשב שלי':'My PC'}</h2>
    <p class="sub">${esc(verLabel(P.winVer))} · ${P.arch==='arm64'?'ARM64':P.arch==='x64'?'64-bit':'32-bit'} · ${P.sysLang==='he'?'עברית':'English'}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">
      <button class="btn" onclick="openSetup()">${he?'שנה הגדרות מחשב':'Change PC settings'}</button>
      <button class="btn" onclick="openOnboarding(true)">${he?'📖 מדריך שימוש':'📖 How-to guide'}</button>
      <button class="btn ghost" id="clearAll" style="border-color:var(--red);color:var(--red)">${he?'מחק את כל הנתונים':'Delete all data'}</button>
    </div>`;
  c.appendChild(dz);
  dz.querySelector('#clearAll').onclick=()=>{
    if(!confirm(he?'למחוק את כל ההעדפות, המועדפים והחיבורים? פעולה זו אינה הפיכה.':'Delete all preferences, favorites and connections? This cannot be undone.'))return;
    ['pcg_profile','pcg_theme','pcg_favs','pcg_ai','pcg_setup'].forEach(k=>store.del(k));
    P={uiLang:'he',winVer:'win11',sysLang:'he',arch:'x64'};aiSel=null;applyDir();applyTheme('gold');
    alert(he?'הכל נמחק':'All cleared');go('home');openSetup();
  };
}

let obStep=0, obFromSettings=false;
function openOnboarding(fromSettings){obStep=0;obFromSettings=!!fromSettings;renderOnboarding();}
function renderOnboarding(){
  const he=P.uiLang==='he';const s=OB_STEPS[obStep];const last=obStep===OB_STEPS.length-1;
  const dots=OB_STEPS.map((_,i)=>`<span style="width:8px;height:8px;border-radius:50%;background:${i===obStep?'var(--accent)':'var(--border)'};display:inline-block"></span>`).join('');
  document.getElementById('modal').innerHTML=`<div class="overlay"><div class="sheet" style="max-width:440px;text-align:center">

      <div style="display:flex;gap:6px">

      </div>
      <button class="btn ghost" style="padding:5px 12px;font-size:13px" onclick="obFinish()">${he?'דלג':'Skip'}</button>
    </div>
    <div style="font-size:58px;margin:20px 0 6px;line-height:1">${s.em}</div>
    <h2 style="font-size:22px;margin:0 0 10px">${esc(L(s.title))}</h2>
    <p style="color:var(--muted);font-size:15px;line-height:1.65;margin:0 auto;max-width:340px">${esc(L(s.body))}</p>
    <div style="display:flex;gap:7px;justify-content:center;margin:24px 0 18px">${dots}</div>
    <div style="display:flex;gap:10px">
      ${obStep>0?`<button class="btn" style="flex:1" onclick="obPrev()">${he?'⟵ הקודם':'⟵ Back'}</button>`:''}
      <button class="btn primary" style="flex:2" onclick="${last?'obFinish()':'obNext()'}">${last?(he?'בוא נתחיל ✓':"Let's start ✓"):(he?'הבא ⟶':'Next ⟶')}</button>
    </div>
  </div></div>`;
}
function obLang(l){P.uiLang=l;saveProfile();applyDir();renderOnboarding();}
function obNext(){if(obStep<OB_STEPS.length-1){obStep++;renderOnboarding();}}
function obPrev(){if(obStep>0){obStep--;renderOnboarding();}}
function obFinish(){
  store.set('pcg_onboarded','1');closeModal();
  if(obFromSettings){go('home');}
  else if(!store.get('pcg_setup')){openSetup();}
  else{go('home');}
}

/* ============================ APPNEST ASSISTANT MAP ============================ */
function assistantCatalog(){
  const byCat={};
  ITEMS.forEach(i=>{(byCat[i.cat]=byCat[i.cat]||[]).push(i.title.he+" / "+i.title.en);});
  return CATS.map(cat=>{
    const list=(byCat[cat.id]||[]).slice(0,40).join("; ");
    const trees=TREES.filter(t=>t.cat===cat.id).map(t=>t.title.he).join(", ");
    return "• "+cat.he+": "+(list||"")+(trees?" | תקלות מודרכות: "+trees:"");
  }).join("\n");
}
