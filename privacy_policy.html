const copy={he:`<h1>פרטיות ונתונים</h1><p class="date">מדריך המחשב · AppNest · גרסה 3.0 · עודכן 23.09.2026</p>
<p class="box">המדריך הבסיסי פועל בדפדפן בלי חשבון. הוא אינו סורק את המחשב, אינו קורא קובצי מערכת ואינו מריץ את פקודות Windows שמוצגות בו.</p>
<h2>מה נשמר בדפדפן?</h2><p>הפרופיל שבחרת, שפת הממשק, ערכת הצבעים, מועדפים, התקדמות בתרגולים ובמסלולי פתרון, והשלמת מדריך הפתיחה נשמרים ב־localStorage. אם חיברת עוזר חכם, גם פרטי החיבור ומפתחות ה־API נשמרים שם. שיחת העוזר נשמרת מקומית, עד 30 הודעות. נתונים אלה אינם מסונכרנים אוטומטית בין מכשירים.</p>
<h2>העוזר החכם הוא חיבור נפרד</h2><p>בעת שליחת שאלה או בדיקת חיבור, הדפדפן פונה לספק שבחרת. הבקשה יכולה לכלול מפתח API, טקסט שאלה, עד 12 הודעות קודמות, פרופיל Windows שבחרת, המסך הנוכחי וקטלוג המדריך. הספק מטפל בנתונים לפי התנאים ומדיניות הפרטיות שלו. כתובת מקומית או מותאמת אישית מקבלת את הבקשות בהתאם להגדרותיך. אין צורך בעוזר כדי להשתמש בקטלוג, בתרגולים או במסלולים.</p>
<h2>הכתבה והקראה</h2><p>כפתור המיקרופון בעוזר מפעיל זיהוי דיבור רק לאחר לחיצה והרשאת הדפדפן. לפי הדפדפן ומערכת ההפעלה, אודיו עשוי להישלח לשירות זיהוי דיבור. המדריך אינו שומר קובץ הקלטה. הטקסט המזוהה מוכנס לשדה ההודעה ונשלח לעוזר רק כאשר בוחרים לשלוח. הקראה משתמשת במנגנון הדיבור של הדפדפן; זמינות קולות ועיבוד מקומי תלויים במכשיר.</p>
<h2>אתר, קישורים ועבודה ללא רשת</h2><p>טעינת האתר מ־GitHub Pages כרוכה בבקשת רשת לשרת המארח, שיכול לקבל מידע טכני רגיל כגון כתובת IP ופרטי דפדפן. המדריך אינו מוסיף שירות ניתוח שימוש או פרסום. קישורים למקורות ולספקים נפתחים באתרים חיצוניים. לאחר טעינה ראשונה מוצלחת, דפדפן שתומך ב־Service Worker שומר את קובצי המדריך במטמון לשימוש אופליין. מקורות חיצוניים ועוזר חכם דורשים רשת.</p>
<h2>גיבוי ומחיקה</h2><p>ייצוא גיבוי מוריד קובץ JSON עם פרופיל, ערכת צבע, מועדפים והתקדמות בלבד. הוא אינו כולל מפתחות API או היסטוריית שיחה. ייבוא מחליף את השדות הכלולים לאחר בדיקת תקינות. „מחק את כל הנתונים” בהגדרות מוחק את העדפות המדריך, ההתקדמות, החיבורים ושיחת העוזר מהדפדפן הזה. הוא אינו מוחק בקשות שכבר התקבלו אצל ספק חיצוני. לניקוי גם של קובצי האתר במטמון, השתמש בהגדרות נתוני האתר בדפדפן.</p>
<h2>מחשב משותף</h2><p>מפתחות ושיחות נשמרים בדפדפן ללא הצפנה ייעודית של האפליקציה. במחשב משותף מומלץ לנתק את העוזר ולמחוק את הנתונים בסיום. הימנע מהזנת סיסמאות או מידע שאינו דרוש לשאלה.</p>`,
en:`<h1>Privacy & data</h1><p class="date">PC Guide · AppNest · Version 3.0 · Updated September 22, 2026</p>
<p class="box">The core guide runs in your browser without an account. It does not scan your PC, read system files or execute the Windows commands it displays.</p>
<h2>What stays in the browser?</h2><p>Your selected profile, interface language, theme, favorites, exercise progress, scenario stages and selected troubleshooting answers, and onboarding status are stored in localStorage. If you connect the optional assistant, connection settings and API keys are also stored there. Up to 30 assistant messages are stored locally. This data does not automatically sync between devices.</p>
<h2>The assistant is a separate connection</h2><p>When you send a question or test a connection, the browser contacts your selected provider. Requests may include an API key, your question, up to 12 previous messages, your selected Windows profile, the current screen and the guide catalog. The provider processes data under its own terms and privacy policy. Local and custom endpoints receive requests according to your settings. The catalog, exercises and troubleshooting flows do not require the assistant.</p>
<h2>Voice input and speech</h2><p>The assistant’s microphone button starts speech recognition only after a click and browser permission. Depending on your browser and operating system, audio may be sent to a speech-recognition service. The guide does not save an audio recording. Recognized text enters the message field and is sent to the assistant only when you choose to send it. Read-aloud uses browser speech synthesis; available voices and local processing depend on your device.</p>
<h2>Hosting, links and offline use</h2><p>Loading the site from GitHub Pages sends a request to the host, which may receive ordinary technical data such as IP address and browser information. The guide does not add analytics or advertising services. Documentation and provider links open external websites. After a successful first load, a browser supporting Service Workers caches the guide files for offline use. External documentation and the assistant need a network connection.</p>
<h2>Backup and deletion</h2><p>Export downloads a JSON file containing only the profile, theme, favorites and progress. API keys and conversations are excluded. Import validates and replaces the included fields. “Delete all data” in Settings removes the guide’s local preferences, progress, connections and assistant conversation from this browser. It cannot erase requests already received by external providers. To also remove cached site files, use your browser’s site-data settings.</p>
<h2>Shared computers</h2><p>Keys and conversations are stored in the browser without application-level encryption. On a shared computer, disconnect the assistant and delete local data when finished. Avoid entering passwords or information that is not needed for your question.</p>`};
